<!-- صورة تجريبية للواجهة الرئيسية: كثبان وغروب ومخيم. استبدلها بصورتك الحقيقية. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Bahariya desert sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1729"/>
      <stop offset="0.55" stop-color="#c2703a"/>
      <stop offset="1" stop-color="#f7c978"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9b96e"/>
      <stop offset="1" stop-color="#a4642b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="840" cy="410" r="105" fill="#ffd98a" opacity="0.9"/>
  <circle cx="840" cy="410" r="155" fill="#ffd98a" opacity="0.12"/>
  <path d="M0 520 Q260 430 520 520 T1200 500 V800 H0Z" fill="url(#sand)"/>
  <path d="M0 620 Q320 540 660 630 T1200 600 V800 H0Z" fill="#c8873f" opacity="0.85"/>
  <path d="M180 800 L300 640 L420 800Z" fill="#5b3a22"/>
  <path d="M300 640 L420 800 L330 800Z" fill="#34251a"/>
  <path d="M300 640 L300 800" stroke="#8a5a2e" stroke-width="4"/>
  <circle cx="520" cy="660" r="34" fill="#ff9d3c" opacity="0.85"/>
  <circle cx="520" cy="660" r="70" fill="#ff9d3c" opacity="0.15"/>
  <g fill="#fff3cf" opacity="0.7">
    <circle cx="120" cy="90" r="2"/><circle cx="260" cy="150" r="1.5"/><circle cx="420" cy="70" r="2"/>
    <circle cx="620" cy="130" r="1.5"/><circle cx="980" cy="90" r="2"/><circle cx="1100" cy="170" r="1.5"/>
  </g>
</svg>
